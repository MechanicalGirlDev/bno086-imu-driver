[package]
name = "bno086-serial"
version = "0.1.4"
edition = "2024"
authors = ["nop <noplab90@gmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/MechanicalGirlDev/bno086-imu-driver"
description = "Serial IMU source for the BNO086_ROS2Board postcard+COBS protocol"

[lib]
name = "bno086_serial"
path = "src/lib.rs"

[[bin]]
name = "bno086"
path = "src/main.rs"

[dependencies]
tracing = "0.1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }

# The vendored board protocol in src/protocol.rs and src/frame.rs uses postcard.
# Keep its version aligned with the upstream BNO086_ROS2Board firmware.
postcard = { version = "1.1", features = ["use-std"] }
crc = "3.4"

serialport = "4"

# Command-line bring-up utility.
clap = { version = "4", features = ["derive"] }
anyhow = "1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[lints.rust]
unsafe_code = "deny"
missing_docs = "deny"
missing_debug_implementations = "warn"
unused_import_braces = "warn"
unused_qualifications = "warn"
unused_results = "warn"
variant_size_differences = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
std_instead_of_core = "warn"
std_instead_of_alloc = "warn"
